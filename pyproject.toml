[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netbox-deployment"
version = "0.1.0"
description = "NetBox Unified Deployment and Automation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pynetbox>=7.0.0",
    "PyYAML>=6.0",
    "GitPython>=3.1.32",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-PyYAML",
    "pre-commit>=3.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=automation --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["automation"]
